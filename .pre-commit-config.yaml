# Run via:  uv run pre-commit install   (once, after cloning)
# Then on every commit:  pre-commit runs ruff/mypy/secret-scan automatically.
# Manual full sweep:  uv run pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: detect-private-key
      - id: check-case-conflict

  # Ruff: lint + format (replaces black, isort, flake8, autoflake).
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # Mypy: type checking (strict on app/).
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        args: [--config-file=pyproject.toml]
        additional_dependencies:
          - pydantic>=2.7
          - types-python-dateutil
        files: ^app/
        exclude: ^(alembic/versions/|tests/)

  # Gitleaks: catches anything that looks like a token/secret on its way to a commit.
  # This is the safety net for the .env-in-repo incident; we never want a second one.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks
