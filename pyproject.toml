[project]
name = "logistic-load-manager"
version = "0.1.0"
description = "FastAPI-based logistics load management system with Telegram bot integration."
requires-python = ">=3.12"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Muhriddin", email = "wg.super.statist@gmail.com" }]

dependencies = [
    # Web framework
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",

    # DB — async-first stack: asyncpg driver + SQLAlchemy AsyncSession.
    # psycopg2-binary is kept ONLY because some tools (older Alembic versions,
    # local psql scripts) still expect a sync URL. Runtime uses asyncpg.
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "asyncpg>=0.30,<0.31",  # 0.30+ ships cp314 wheels
    "psycopg2-binary>=2.9.9,<3.0",
    "alembic>=1.13,<2.0",
    "greenlet>=3.0,<4.0",  # required by sqlalchemy's asyncio bridge

    # Validation / settings
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.4,<3.0",

    # Env
    "python-dotenv>=1.0,<2.0",

    # HTTP / async
    "aiohttp>=3.10,<4.0",

    # Date utils
    "python-dateutil>=2.9,<3.0",

    # Telegram bot
    "aiogram>=3.4,<4.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6,<0.7",
    "mypy>=1.11,<2.0",
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<0.25",
    "pytest-cov>=5.0,<6.0",
    "httpx>=0.27,<0.28",
    "pre-commit>=3.8,<4.0",
    "types-python-dateutil>=2.9,<3.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions", "frontend"]

[tool.ruff.lint]
# Sensible defaults: pyflakes, pycodestyle, isort, bugbear, simplify, pyupgrade.
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "C4",   # comprehensions
    "UP",   # pyupgrade
    "SIM",  # simplify
    "RUF",  # ruff-specific
    "ASYNC", # async correctness
    "S",    # bandit (security)
    "G",    # logging format (catches f-string in logger)
    "T20",  # flake8-print (catches stray print())
]
ignore = [
    "E501",   # handled by formatter
    "S101",   # assert in tests is fine
    "B008",   # FastAPI uses Depends() in defaults — pattern, not bug
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S", "T20"]
"alembic/**/*.py" = ["E", "F", "I"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
disallow_untyped_decorators = false  # FastAPI / aiogram decorators
exclude = ["alembic/versions/", "frontend/", "tests/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: tests that hit a real DB",
    "unit: pure unit tests",
]
