# docker-compose.yml — single command to bring up API + bot + Postgres.
#
#   docker compose --profile bot up         # API + DB + bot
#   docker compose up                       # API + DB only
#
# The `app` service runs alembic on startup; the `bot` service sets
# SKIP_MIGRATIONS=1 to avoid racing on alembic_version.

services:

  db:
    image: postgres:16-alpine
    container_name: logistics-db
    restart: unless-stopped
    networks: [app-network]
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      POSTGRES_DB: ${DB_NAME:-logistics}
    volumes:
      - logistics-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 5
    # Host port intentionally NOT exposed by default — only the app
    # network can reach the DB. Uncomment for psql-from-host debugging.
    # ports:
    #   - "5432:5432"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: logistics-api:latest
    container_name: logistics-api
    restart: unless-stopped
    networks: [app-network]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      DB_NAME: ${DB_NAME:-logistics}
      DEBUG: ${DEBUG:-False}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set in .env}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-60}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: logistics-api:latest
    container_name: logistics-bot
    restart: unless-stopped
    profiles: [bot]  # `docker compose --profile bot up` to include
    networks: [app-network]
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      DB_NAME: ${DB_NAME:-logistics}
      DEBUG: ${DEBUG:-False}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN must be set when running bot}
      SKIP_MIGRATIONS: "1"  # API container handles migrations
    command: ["python", "app/bot/start_bot.py"]

volumes:
  logistics-db-data:

networks:
  app-network:
    driver: bridge
